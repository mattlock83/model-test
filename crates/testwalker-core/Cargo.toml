[package]
name = "testwalker-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Target-independent graph and property testing with a JSON-RPC adapter boundary"

[dependencies]
graphwalker-core = { git = "https://github.com/GraphWalker/graphwalker-rs.git", rev = "21e6b7d72c3daab26d9cd6a1dff899275e411b23" }
graphwalker-dsl = { git = "https://github.com/GraphWalker/graphwalker-rs.git", rev = "21e6b7d72c3daab26d9cd6a1dff899275e411b23" }
graphwalker-io = { git = "https://github.com/GraphWalker/graphwalker-rs.git", rev = "21e6b7d72c3daab26d9cd6a1dff899275e411b23" }
hegel = { package = "hegeltest", git = "https://github.com/hegeldev/hegel-rust.git", rev = "33d94c659e441127ce7b5a0f046ec4aa9315d794", features = ["static-engine"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
regex = "1"
rust_decimal = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
