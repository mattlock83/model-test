[project]
name = "testwalker"
version = "3.2.0"
readme = "README.md"
description = "Business-model browser testing with GraphWalker, Jev Ultrafast and Hypothesis"
requires-python = ">=3.12"
dependencies = [
  "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git@1231850a0bf1a0c0341fe408ef1668dbbfdfac46",
  "hypothesis>=6.140,<7",
  "python-dotenv>=1,<2",
]

[project.scripts]
testwalker = "testwalker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["testwalker"]

[tool.hatch.build.targets.wheel.force-include]
"models" = "testwalker/data/models"
"dist" = "testwalker/data/dist"
"docs/model-format.md" = "testwalker/data/model-format.md"
"examples" = "testwalker/data/examples"
"testwalker.properties.example" = "testwalker/data/testwalker.properties.example"
"docs/hooks.md" = "testwalker/data/hooks.md"

[tool.hatch.build.targets.sdist]
include = ["testwalker", "models", "dist", "docs", "examples", "tests", "pyproject.toml", "README.md", "testwalker.properties.example", "uv.lock"]

[tool.hatch.build.targets.sdist.force-include]
"dist" = "dist"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
