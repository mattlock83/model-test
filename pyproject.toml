[project]
name = "testwalker"
version = "4.0.0"
readme = "README.md"
description = "Model-driven testing with a native GraphWalker/Hegel core and Jev browser adapter"
requires-python = ">=3.12"
dependencies = [
  "jev-ultrafast @ git+https://github.com/browser-use/jev-ultrafast.git@1231850a0bf1a0c0341fe408ef1668dbbfdfac46",
  "python-dotenv>=1,<2",
  "playwright>=1.55,<2",
  "crawlee[playwright]>=1.10,<2",
]

[project.scripts]
testwalker = "testwalker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["testwalker"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"models/booking.json" = "testwalker/data/models/booking.json"
"models/feedback.json" = "testwalker/data/models/feedback.json"
"models/trailhead.json" = "testwalker/data/models/trailhead.json"
"models/rpc-selftest.json" = "testwalker/data/models/rpc-selftest.json"
"dist" = "testwalker/data/dist"
"docs/model-format.md" = "testwalker/data/model-format.md"
"examples" = "testwalker/data/examples"
"testwalker.properties.example" = "testwalker/data/testwalker.properties.example"
"docs/hooks.md" = "testwalker/data/hooks.md"
"docs/testing.md" = "testwalker/data/testing.md"
"docs/architecture.md" = "testwalker/data/architecture.md"
"docs/protocol.md" = "testwalker/data/protocol.md"
"docs/rpc-testing.md" = "testwalker/data/rpc-testing.md"
"docs/discovery.md" = "testwalker/data/discovery.md"
"docs/input-strategies.md" = "testwalker/data/input-strategies.md"

[tool.hatch.build.targets.sdist]
include = [
  "testwalker", "models/booking.json", "models/feedback.json", "models/trailhead.json", "models/rpc-selftest.json",
  "dist", "docs", "examples", "tests", "pyproject.toml", "README.md",
  "testwalker.properties.example", "uv.lock", "Cargo.toml", "Cargo.lock", "crates", "hatch_build.py",
]

[tool.hatch.build.targets.sdist.force-include]
"dist" = "dist"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
